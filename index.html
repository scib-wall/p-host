<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Host HQ — 6-Min Live Circuit 🔬</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    :root {
      --bg: #070a12;
      --card: rgba(15, 23, 42, 0.88);
      --border: rgba(56, 189, 248, 0.3);
      --cyan: #38bdf8;
      --gold: #f59e0b;
      --green: #22c55e;
      --red: #f43f5e;
      --purple: #a855f7;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }

    body { 
      background: linear-gradient(135deg, #050811 0%, #0f172a 50%, #1a103c 100%); 
      color: #fff; 
      padding: 1.5rem; 
      min-height: 100vh; 
    }

    header { 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      background: var(--card); 
      border: 1px solid var(--border); 
      border-radius: 18px; 
      padding: 1rem 1.8rem; 
      margin-bottom: 1.5rem; 
      flex-wrap: wrap;
      gap: 1rem;
    }

    .master-timer {
      background: rgba(245, 158, 11, 0.15);
      border: 1px solid var(--gold);
      color: var(--gold);
      padding: 0.5rem 1rem;
      border-radius: 12px;
      font-weight: 900;
      font-size: 1.1rem;
    }

    .radar-container { 
      background: var(--card); 
      border: 1px solid var(--border); 
      border-radius: 20px; 
      padding: 1.8rem; 
      margin-bottom: 1.5rem; 
      overflow-x: auto;
    }
    .track-svg { width: 100%; height: auto; min-width: 900px; max-height: 320px; }

    .squad-node circle { 
      stroke: #ffffff; 
      stroke-width: 3; 
      transition: all 0.3s ease;
    }
    .squad-node text { fill: #fff; font-size: 10px; font-weight: 900; text-anchor: middle; }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 1rem; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 1.2rem; display: flex; flex-direction: column; gap: 0.8rem; }
    .card.winner { border-color: var(--gold); box-shadow: 0 0 25px rgba(245, 158, 11, 0.4); }

    .progress-bar { width: 100%; height: 8px; background: rgba(255,255,255,0.1); border-radius: 10px; overflow: hidden; }
    .progress-fill { height: 100%; background: linear-gradient(90deg, var(--cyan), var(--purple)); }

    .btn-start { background: var(--green); color: #000; border: none; padding: 0.7rem 1.4rem; border-radius: 12px; font-weight: 900; cursor: pointer; }
    .btn-pause { background: var(--gold); color: #000; border: none; padding: 0.7rem 1.4rem; border-radius: 12px; font-weight: 900; cursor: pointer; }
    .btn-end { background: var(--purple); color: #fff; border: none; padding: 0.7rem 1.4rem; border-radius: 12px; font-weight: 900; cursor: pointer; }
    .btn-reset { background: var(--red); color: white; border: none; padding: 0.7rem 1.4rem; border-radius: 12px; font-weight: 800; cursor: pointer; }

    .countdown-overlay {
      position: fixed; inset: 0; background: rgba(7, 10, 18, 0.94); backdrop-filter: blur(12px);
      display: none; justify-content: center; align-items: center; flex-direction: column; z-index: 999;
    }
    .countdown-num { font-size: 9rem; font-weight: 900; color: var(--cyan); text-shadow: 0 0 30px var(--cyan); }

    /* Dramatic Celebration Overlay */
    .celebration-overlay {
      position: fixed; inset: 0; background: rgba(5, 8, 17, 0.96); backdrop-filter: blur(16px);
      display: none; justify-content: center; align-items: center; flex-direction: column; z-index: 1000;
      animation: fadeIn 0.6s ease;
    }
    @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }

    .modal-box {
      background: rgba(15, 23, 42, 0.95); border: 2px solid var(--gold); border-radius: 28px;
      padding: 3rem; max-width: 650px; width: 90%; text-align: center;
      box-shadow: 0 0 60px rgba(245, 158, 11, 0.35); animation: pulseGlow 2s infinite alternate;
    }
    @keyframes pulseGlow { 0% { box-shadow: 0 0 30px rgba(245, 158, 11, 0.2); } 100% { box-shadow: 0 0 70px rgba(245, 158, 11, 0.5); } }

    .podium-list { margin: 1.5rem 0; display: flex; flex-direction: column; gap: 0.8rem; }
    .podium-item {
      background: rgba(255, 255, 255, 0.05); border: 1px solid var(--border); border-radius: 14px;
      padding: 0.8rem 1.2rem; display: flex; justify-content: space-between; align-items: center; font-weight: 800;
    }

    @media (max-width: 768px) {
      body { padding: 0.8rem; }
      header { flex-direction: column; align-items: stretch; text-align: center; }
      .header-controls { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; width: 100%; gap: 0.5rem; }
      .radar-container { padding: 1rem; }
      .grid { grid-template-columns: 1fr; }
    }
  </style>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>

  <div class="countdown-overlay" id="overlayCountdown">
    <div style="color:var(--gold); font-size:1.8rem; font-weight:900; letter-spacing: 2px;">GET READY...</div>
    <div class="countdown-num" id="txtCountNum">3</div>
  </div>

  <!-- Dramatic Celebration Modal -->
  <div class="celebration-overlay" id="overlayCelebration">
    <div class="modal-box">
      <div style="font-size: 5rem;">🏆✨🏁</div>
      <h1 style="color:var(--gold); font-size:2.5rem; font-weight:900; letter-spacing: 1px;">PEDIG-RACE CONCLUDED!</h1>
      <p style="color:#94a3b8; font-size: 1.1rem; margin-top: 0.5rem;">Official telemetry finalized by Genetics HQ</p>
      
      <div class="podium-list" id="podiumList"></div>

      <button class="btn-start" style="padding: 1rem 2.5rem; font-size: 1.1rem; margin-top: 1rem;" onclick="closeCelebration()">CLOSE & ACKNOWLEDGE ⚡</button>
    </div>
  </div>

  <header>
    <div>
      <h1 style="color:var(--cyan); font-size:1.6rem; font-weight:900;">PEDIG-RACE!</h1>
      <p style="color:#94a3b8; font-size:0.85rem;">Live 10-Question Pedigree Circuit Radar</p>
    </div>
    <div style="display:flex; gap:0.6rem; align-items:center;" class="header-controls">
      <div class="master-timer" id="hqTimer">⏱️ WAITING</div>
      <button class="btn-start" id="btnStartRace" onclick="triggerRaceStart()">START RACE 🚀</button>
      <button class="btn-pause" id="btnPauseRace" style="display:none;" onclick="togglePauseRace()">PAUSE ⏸️</button>
      <button class="btn-end" id="btnEndRace" style="display:none;" onclick="endRaceHost()">END GAME 🛑</button>
      <button class="btn-reset" onclick="resetHQ()">RESET HQ 🔄</button>
    </div>
  </header>

  <div class="radar-container">
    <svg class="track-svg" viewBox="0 0 1000 280">
      <path d="M 60 140 L 150 80 L 240 200 L 330 80 L 420 200 L 510 80 L 600 200 L 690 80 L 780 200 L 900 140" fill="none" stroke="rgba(56,189,248,0.2)" stroke-width="6" stroke-dasharray="8" />

      <circle cx="60" cy="140" r="22" fill="#0f172a" stroke="#38bdf8" stroke-width="3" />
      <text x="60" y="144" fill="#38bdf8" font-size="10" font-weight="900" text-anchor="middle">Q1</text>

      <circle cx="150" cy="80" r="22" fill="#0f172a" stroke="#38bdf8" stroke-width="3" />
      <text x="150" y="84" fill="#38bdf8" font-size="10" font-weight="900" text-anchor="middle">Q2</text>

      <circle cx="240" cy="200" r="22" fill="#0f172a" stroke="#38bdf8" stroke-width="3" />
      <text x="240" y="204" fill="#38bdf8" font-size="10" font-weight="900" text-anchor="middle">Q3</text>

      <circle cx="330" cy="80" r="22" fill="#0f172a" stroke="#38bdf8" stroke-width="3" />
      <text x="330" y="84" fill="#38bdf8" font-size="10" font-weight="900" text-anchor="middle">Q4</text>

      <circle cx="420" cy="200" r="22" fill="#0f172a" stroke="#a855f7" stroke-width="3" />
      <text x="420" y="204" fill="#a855f7" font-size="10" font-weight="900" text-anchor="middle">Q5</text>

      <circle cx="510" cy="80" r="22" fill="#0f172a" stroke="#a855f7" stroke-width="3" />
      <text x="510" y="84" fill="#a855f7" font-size="10" font-weight="900" text-anchor="middle">Q6</text>

      <circle cx="600" cy="200" r="22" fill="#0f172a" stroke="#f43f5e" stroke-width="3" />
      <text x="600" y="204" fill="#f43f5e" font-size="10" font-weight="900" text-anchor="middle">Q7</text>

      <circle cx="690" cy="80" r="22" fill="#0f172a" stroke="#f43f5e" stroke-width="3" />
      <text x="690" y="84" fill="#f43f5e" font-size="10" font-weight="900" text-anchor="middle">Q8</text>

      <circle cx="780" cy="200" r="22" fill="#0f172a" stroke="#f43f5e" stroke-width="3" />
      <text x="780" y="204" fill="#f43f5e" font-size="10" font-weight="900" text-anchor="middle">Q9</text>

      <circle cx="900" cy="140" r="28" fill="#0f172a" stroke="#f59e0b" stroke-width="4" />
      <text x="900" y="145" fill="#f59e0b" font-size="14" font-weight="900" text-anchor="middle">🏆</text>

      <g id="teamNodesGroup"></g>
    </svg>
  </div>

  <div class="grid" id="squadGrid"></div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDtPA9VQ4Yv1MpvbYqdCW24bDf03tOpKqU",
      authDomain: "pedigree-9f98c.firebaseapp.com",
      databaseURL: "https://pedigree-9f98c-default-rtdb.firebaseio.com",
      projectId: "pedigree-9f98c",
      storageBucket: "pedigree-9f98c.firebasestorage.app",
      messagingSenderId: "484562688449",
      appId: "1:484562688449:web:ca050a92acdfcb0b183740"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const coords = {
      1: { x: 60, y: 140 },
      2: { x: 150, y: 80 },
      3: { x: 240, y: 200 },
      4: { x: 330, y: 80 },
      5: { x: 420, y: 200 },
      6: { x: 510, y: 80 },
      7: { x: 600, y: 200 },
      8: { x: 690, y: 80 },
      9: { x: 780, y: 200 },
      10: { x: 900, y: 140 }
    };

    let firstWinner = false;
    let serverOffset = 0;
    let startTime = null;
    let isPaused = false;
    let isEnded = false;
    let latestSquadList = [];

    function getSquadColor(index) {
      const hue = (index * 137.5) % 360;
      return `hsl(${hue}, 85%, 60%)`;
    }

    db.ref('.info/serverTimeOffset').on('value', (snap) => {
      serverOffset = snap.val() || 0;
    });

    db.ref('quizState').on('value', (snap) => {
      const state = snap.val() || {};
      startTime = state.startTime || null;
      isPaused = state.paused || false;
      isEnded = state.ended || false;

      const btnStart = document.getElementById('btnStartRace');
      const btnPause = document.getElementById('btnPauseRace');
      const btnEnd = document.getElementById('btnEndRace');

      if (startTime && !isEnded) {
        btnStart.style.display = 'none';
        btnPause.style.display = 'inline-block';
        btnEnd.style.display = 'inline-block';
        btnPause.textContent = isPaused ? 'RESUME ▶️' : 'PAUSE ⏸️';
      } else {
        btnStart.style.display = 'inline-block';
        btnPause.style.display = 'none';
        btnEnd.style.display = 'none';
        document.getElementById('overlayCountdown').style.display = 'none';
      }

      if (isEnded) {
        triggerCelebration();
      }
    });

    setInterval(() => {
      if (!startTime) {
        document.getElementById('hqTimer').textContent = "⏱️ WAITING";
        return;
      }
      if (isPaused) {
        document.getElementById('hqTimer').textContent = "⏱️ PAUSED";
        return;
      }
      if (isEnded) {
        document.getElementById('hqTimer').textContent = "⏱️ CONCLUDED";
        return;
      }

      const exactServerNow = Date.now() + serverOffset;
      const secondsUntilStart = Math.ceil((startTime - exactServerNow) / 1000);

      const overlay = document.getElementById('overlayCountdown');
      const num = document.getElementById('txtCountNum');

      if (secondsUntilStart > 0) {
        overlay.style.display = 'flex';
        num.textContent = secondsUntilStart;
        document.getElementById('hqTimer').textContent = `⏱️ STARTING IN ${secondsUntilStart}s`;
        return;
      } else if (secondsUntilStart === 0) {
        overlay.style.display = 'flex';
        num.textContent = "GO!";
        document.getElementById('hqTimer').textContent = `⏱️ 06:00`;
        return;
      } else {
        overlay.style.display = 'none';
      }

      const elapsedSeconds = Math.floor((exactServerNow - startTime) / 1000);
      const hqTime = Math.max(0, 360 - elapsedSeconds);
      let m = Math.floor(hqTime / 60).toString().padStart(2, '0');
      let s = (hqTime % 60).toString().padStart(2, '0');
      document.getElementById('hqTimer').textContent = `⏱️ ${m}:${s}`;

      if (hqTime <= 0 && !isEnded) {
        endRaceHost();
      }
    }, 200);

    function triggerRaceStart() {
      const futureStartTime = Date.now() + serverOffset + 3500;
      db.ref('quizState').set({ startTime: futureStartTime, paused: false, ended: false });
    }

    function togglePauseRace() {
      db.ref('quizState').update({ paused: !isPaused });
    }

    function endRaceHost() {
      db.ref('quizState').update({ ended: true, paused: false });
    }

    function triggerCelebration() {
      const overlay = document.getElementById('overlayCelebration');
      overlay.style.display = 'flex';
      confetti({ particleCount: 350, spread: 120, origin: { y: 0.6 } });

      const podium = document.getElementById('podiumList');
      podium.innerHTML = '';

      if (latestSquadList.length === 0) {
        podium.innerHTML = `<div style="color:#94a3b8;">No squad telemetry logged.</div>`;
        return;
      }

      latestSquadList.slice(0, 3).forEach((squad, i) => {
        const medals = ['🥇 1ST PLACE', '🥈 2ND PLACE', '🥉 3RD PLACE'];
        const colors = ['var(--gold)', '#cbd5e1', '#cd7f32'];
        const item = document.createElement('div');
        item.className = 'podium-item';
        item.style.borderColor = colors[i] || 'var(--border)';
        item.innerHTML = `
          <span style="color:${colors[i]}">${medals[i] || `#${i+1}`} • ${squad.team}</span>
          <span style="color:var(--cyan)">Q${squad.questionIndex || 1}/10 (${squad.timeElapsed || 0}s)</span>
        `;
        podium.appendChild(item);
      });
    }

    function closeCelebration() {
      document.getElementById('overlayCelebration').style.display = 'none';
    }

    db.ref('teams').on('value', (snap) => {
      const data = snap.val();
      const nodesGroup = document.getElementById('teamNodesGroup');
      const grid = document.getElementById('squadGrid');

      if (!data) {
        nodesGroup.innerHTML = '';
        grid.innerHTML = `<div style="grid-column: 1/-1; text-align: center; color: #94a3b8; padding: 2rem;">📡 Waiting for squad connections...</div>`;
        latestSquadList = [];
        return;
      }

      const list = Object.keys(data).map(k => data[k]);
      list.sort((a, b) => (b.questionIndex || b.stage) - (a.questionIndex || a.stage) || a.timeElapsed - b.timeElapsed);
      latestSquadList = list;

      nodesGroup.innerHTML = '';
      grid.innerHTML = '';

      if (list[0] && list[0].status === 'Finished' && !firstWinner) {
        firstWinner = true;
        confetti({ particleCount: 200, spread: 100 });
        endRaceHost();
      }

      list.forEach((squad, idx) => {
        const squadColor = getSquadColor(idx);
        const qStep = squad.questionIndex || 1;
        const c = coords[qStep] || coords[1];
        const offsetX = (idx % 3 - 1) * 14;
        const offsetY = Math.floor(idx / 3) * 14;

        const node = document.createElementNS('http://www.w3.org/2000/svg', 'g');
        node.setAttribute('class', 'squad-node');
        node.setAttribute('transform', `translate(${c.x + offsetX}, ${c.y + offsetY})`);
        node.innerHTML = `
          <circle r="13" fill="${squadColor}" style="filter: drop-shadow(0 0 8px ${squadColor});" />
          <text y="4">${squad.team.substring(0, 3).toUpperCase()}</text>
        `;
        nodesGroup.appendChild(node);

        const isFinished = squad.status === 'Finished';
        const pct = Math.min(Math.round((qStep / 10) * 100), 100);

        const card = document.createElement('div');
        card.className = `card ${isFinished && idx === 0 ? 'winner' : ''}`;
        card.innerHTML = `
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <div style="display:flex; align-items:center; gap:8px;">
              <span style="width:12px; height:12px; border-radius:50%; background:${squadColor}; display:inline-block;"></span>
              <strong>${idx === 0 ? '🥇 ' : ''}${squad.team}</strong>
            </div>
            <span style="color:var(--cyan); font-weight:800;">Q${qStep} / 10</span>
          </div>
          <div class="progress-bar"><div class="progress-fill" style="width: ${pct}%;"></div></div>
          <div style="display:flex; justify-content:space-between; font-size:0.8rem; color:#94a3b8;">
            <span>${isFinished ? '🏆 FINISHED' : '⚡ IN FIELD'}</span>
            <span>⏱️ ${squad.timeElapsed || 0}s / 360s</span>
          </div>
        `;
        grid.appendChild(card);
      });
    });

    function resetHQ() {
      if (confirm("Reset headquarters and clear race state?")) {
        firstWinner = false;
        isPaused = false;
        isEnded = false;
        closeCelebration();
        db.ref('teams').remove();
        db.ref('quizState').remove();
      }
    }
  </script>
</body>
</html>
