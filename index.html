<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teacher Command Center - Live Monitor 🖥️</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.85);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #818cf8;
      --success: #34d399;
      --border: rgba(255, 255, 255, 0.1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    
    body {
      background: linear-gradient(-45deg, #0f172a, #1e1b4b, #0284c7, #1e1b4b);
      background-size: 400% 400%;
      animation: gradientBG 15s ease infinite;
      color: var(--text-main);
      min-height: 100vh; padding: 2rem;
    }

    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 2rem; border-bottom: 1px solid var(--border);
      padding-bottom: 1.2rem; backdrop-filter: blur(8px);
    }

    h1 {
      font-size: 2rem; font-weight: 900;
      background: linear-gradient(135deg, #a5b4fc 0%, #38bdf8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: flex; align-items: center; gap: 0.6rem;
    }

    .btn-reset {
      background: linear-gradient(135deg, #f43f5e, #e11d48);
      color: white; border: none; padding: 0.75rem 1.4rem;
      border-radius: 12px; font-weight: 800; cursor: pointer;
      box-shadow: 0 4px 14px rgba(244, 63, 94, 0.4);
      transition: all 0.3s ease;
    }
    .btn-reset:hover { transform: translateY(-2px) scale(1.02); }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 1.5rem;
    }

    .team-card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      border-radius: 20px; padding: 1.4rem;
      display: flex; flex-direction: column; gap: 1rem;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
      transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
      animation: cardPopIn 0.5s ease-out forwards;
    }

    @keyframes cardPopIn {
      0% { transform: scale(0.8); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .team-card.finished {
      border-color: var(--success);
      background: rgba(6, 78, 59, 0.7);
      box-shadow: 0 0 25px rgba(52, 211, 153, 0.3);
    }

    .team-header { display: flex; justify-content: space-between; align-items: center; }
    .team-name { font-weight: 800; font-size: 1.3rem; color: #ffffff; }

    .stage-badge {
      padding: 0.4rem 0.9rem; border-radius: 50px; font-weight: 800; font-size: 0.85rem;
    }
    .stage-badge.r1 { background: #3b82f6; color: white; }
    .stage-badge.r2 { background: #8b5cf6; color: white; }
    .stage-badge.r3 { background: #ec4899; color: white; }
    .stage-badge.done { background: var(--success); color: #022c22; animation: pulse 1s infinite alternate; }

    .progress-bar-bg { width: 100%; height: 12px; background: rgba(255,255,255,0.1); border-radius: 10px; overflow: hidden; }
    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #6366f1, #a855f7);
      width: 33%; transition: width 0.6s ease-in-out;
    }
    .progress-bar-fill.done { background: linear-gradient(90deg, #34d399, #059669); width: 100%; }

    .meta { display: flex; justify-content: space-between; font-size: 0.88rem; color: var(--text-muted); font-weight: 600; }

    @keyframes pulse {
      from { transform: scale(1); }
      to { transform: scale(1.08); }
    }
  </style>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>

  <header>
    <div>
      <h1>📡 Host Live Command Center</h1>
      <p style="color: var(--text-muted); font-size: 0.95rem; margin-top: 0.2rem;">Real-time progress tracker for classroom team missions</p>
    </div>
    <button class="btn-reset" onclick="resetAllTeams()">Reset Session Data 🔄</button>
  </header>

  <div class="grid" id="teamsGrid">
    <div style="color: var(--text-muted); grid-column: 1 / -1; text-align: center; padding: 4rem; font-size: 1.2rem;">
      Waiting for student teams to enter their names... 🚀
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDtPA9VQ4Yv1MpvbYqdCW24bDf03tOpKqU",
      authDomain: "pedigree-9f98c.firebaseapp.com",
      databaseURL: "https://pedigree-9f98c-default-rtdb.firebaseio.com",
      projectId: "pedigree-9f98c",
      storageBucket: "pedigree-9f98c.firebasestorage.app",
      messagingSenderId: "484562688449",
      appId: "1:484562688449:web:ca050a92acdfcb0b183740",
      measurementId: "G-RXF33ECWTL"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    db.ref('teams').on('value', (snapshot) => {
      const data = snapshot.val();
      const grid = document.getElementById('teamsGrid');

      if (!data) {
        grid.innerHTML = `<div style="color: var(--text-muted); grid-column: 1 / -1; text-align: center; padding: 4rem; font-size: 1.2rem;">
          Waiting for student teams to enter their names... 🚀
        </div>`;
        return;
      }

      grid.innerHTML = '';
      Object.keys(data).forEach(key => {
        const item = data[key];
        grid.appendChild(createTeamCard(item));
      });
    });

    function createTeamCard(item) {
      const card = document.createElement('div');
      const isDone = item.status === 'Completed';
      card.className = `team-card ${isDone ? 'finished' : ''}`;

      let stageClass = `r${item.stage}`;
      let stageText = `Round ${item.stage}`;
      let widthPercent = item.stage === 1 ? '33%' : item.stage === 2 ? '66%' : '90%';

      if (isDone) {
        stageClass = 'done';
        stageText = 'FINISHED 🏆';
        widthPercent = '100%';
      }

      let mins = Math.floor((item.timeElapsed || 0) / 60);
      let secs = (item.timeElapsed || 0) % 60;
      let timeStr = `${mins}m ${secs}s`;

      card.innerHTML = `
        <div class="team-header">
          <div class="team-name">⚡ ${item.team}</div>
          <div class="stage-badge ${stageClass}">${stageText}</div>
        </div>
        <div class="progress-bar-bg">
          <div class="progress-bar-fill ${isDone ? 'done' : ''}" style="width: ${widthPercent}"></div>
        </div>
        <div class="meta">
          <span>Status: ${item.status}</span>
          <span>Time: ${timeStr}</span>
        </div>
      `;
      return card;
    }

    function resetAllTeams() {
      if (confirm("Are you sure you want to clear all team progress for a new class period?")) {
        db.ref('teams').remove();
      }
    }
  </script>
</body>
</html>
