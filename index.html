<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Host HQ — Genetics Speed Run Radar 📡</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #050811;
      --panel: rgba(15, 23, 42, 0.9);
      --border: rgba(56, 189, 248, 0.25);
      --cyan: #38bdf8;
      --indigo: #6366f1;
      --green: #22c55e;
      --red: #f43f5e;
      --gold: #f59e0b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }

    body {
      background: linear-gradient(-45deg, #050811, #0f172a, #1e1b4b, #0f172a);
      background-size: 400% 400%;
      animation: gradientBG 15s ease infinite;
      color: #f8fafc;
      min-height: 100vh;
      padding: 1.5rem;
    }
    @keyframes gradientBG { 0%{background-position:0% 50%} 50%{background-position:100% 50%} 100%{background-position:0% 50%} }

    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1rem 1.5rem;
      margin-bottom: 1.5rem;
      backdrop-filter: blur(12px);
    }
    .header-title { font-size: 1.4rem; font-weight: 900; color: var(--cyan); display: flex; align-items: center; gap: 0.5rem; }
    .header-stats { display: flex; gap: 1rem; align-items: center; }

    .stat-badge {
      background: rgba(0,0,0,0.4);
      border: 1px solid var(--border);
      padding: 0.4rem 0.8rem;
      border-radius: 10px;
      font-size: 0.85rem;
      font-weight: 800;
    }

    .btn-clear {
      background: rgba(244, 63, 94, 0.2);
      border: 1px solid var(--red);
      color: var(--red);
      padding: 0.5rem 1rem;
      border-radius: 10px;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .btn-clear:hover { background: var(--red); color: #fff; }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 1.25rem;
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1.25rem;
      backdrop-filter: blur(12px);
      transition: transform 0.2s ease, border-color 0.2s ease;
      position: relative;
    }
    .card.finished { border-color: var(--gold); box-shadow: 0 0 20px rgba(245, 158, 11, 0.25); }

    .card-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
    }
    .team-name { font-size: 1.2rem; font-weight: 900; color: #fff; }
    .status-tag {
      font-size: 0.75rem;
      font-weight: 800;
      padding: 0.25rem 0.6rem;
      border-radius: 20px;
      text-transform: uppercase;
    }
    .tag-active { background: rgba(34, 197, 94, 0.15); color: var(--green); border: 1px solid var(--green); }
    .tag-finished { background: rgba(245, 158, 11, 0.15); color: var(--gold); border: 1px solid var(--gold); }

    /* Progress Tracker Steps */
    .steps-container {
      display: flex;
      justify-content: space-between;
      margin: 1rem 0;
      position: relative;
    }
    .steps-container::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 0;
      right: 0;
      height: 3px;
      background: rgba(255,255,255,0.1);
      z-index: 1;
      transform: translateY(-50%);
    }
    .step-node {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #0f172a;
      border: 2px solid rgba(255,255,255,0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 0.75rem;
      z-index: 2;
      transition: all 0.3s ease;
      color: #64748b;
    }
    .step-node.completed {
      background: var(--green);
      border-color: var(--green);
      color: #000;
      box-shadow: 0 0 10px rgba(34, 197, 94, 0.5);
    }
    .step-node.current {
      background: var(--cyan);
      border-color: var(--cyan);
      color: #000;
      box-shadow: 0 0 12px var(--cyan);
      transform: scale(1.15);
    }

    .meta-row {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      color: #94a3b8;
      font-weight: 700;
      margin-top: 0.8rem;
      padding-top: 0.6rem;
      border-top: 1px solid rgba(255,255,255,0.06);
    }

    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 4rem 2rem;
      background: var(--panel);
      border: 1px dashed var(--border);
      border-radius: 20px;
      color: #64748b;
      font-weight: 700;
    }
  </style>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>

  <div class="header-bar">
    <div class="header-title">📡 COMMAND CENTER: LIVE SQUAD RADAR</div>
    <div class="header-stats">
      <div class="stat-badge">ACTIVE SQUADS: <span id="lblActiveCount" style="color:var(--cyan);">0</span></div>
      <div class="stat-badge">FINISHED: <span id="lblFinishedCount" style="color:var(--gold);">0</span></div>
      <button class="btn-clear" onclick="clearAllTeams()">RESET ALL TEAMS 🗑️</button>
    </div>
  </div>

  <div class="grid" id="teamsGrid">
    <div class="empty-state">Waiting for squads to log in and start the Speed Run...</div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDtPA9VQ4Yv1MpvbYqdCW24bDf03tOpKqU",
      authDomain: "pedigree-9f98c.firebaseapp.com",
      databaseURL: "https://pedigree-9f98c-default-rtdb.firebaseio.com",
      projectId: "pedigree-9f98c",
      storageBucket: "pedigree-9f98c.firebasestorage.app",
      messagingSenderId: "484562688449",
      appId: "1:484562688449:web:ca050a92acdfcb0b183740"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const teamsRef = db.ref('teams');

    teamsRef.on('value', (snapshot) => {
      const grid = document.getElementById('teamsGrid');
      grid.innerHTML = "";

      let activeCount = 0;
      let finishedCount = 0;

      const data = snapshot.val();

      if (!data) {
        grid.innerHTML = '<div class="empty-state">Waiting for squads to log in and start the Speed Run...</div>';
        document.getElementById('lblActiveCount').textContent = "0";
        document.getElementById('lblFinishedCount').textContent = "0";
        return;
      }

      Object.values(data).forEach(team => {
        if (team.status === "Finished") finishedCount++;
        else activeCount++;

        const isFinished = team.status === "Finished";
        const currentRound = team.round || 1;

        const card = document.createElement('div');
        card.className = `card ${isFinished ? 'finished' : ''}`;

        let stepsHTML = '';
        for (let r = 1; r <= 5; r++) {
          let stateClass = '';
          if (isFinished || r < currentRound) {
            stateClass = 'completed';
          } else if (r === currentRound && !isFinished) {
            stateClass = 'current';
          }
          stepsHTML += `<div class="step-node ${stateClass}">R${r}</div>`;
        }

        let timeStr = team.timeElapsed ? `${Math.floor(team.timeElapsed / 60)}m ${team.timeElapsed % 60}s` : '--';

        card.innerHTML = `
          <div class="card-head">
            <div class="team-name">👥 ${team.team}</div>
            <span class="status-tag ${isFinished ? 'tag-finished' : 'tag-active'}">${team.status}</span>
          </div>
          <div class="steps-container">
            ${stepsHTML}
          </div>
          <div class="meta-row">
            <span>CURRENT STAGE: Round ${isFinished ? '5 (Complete)' : currentRound}</span>
            <span>TIME: ${timeStr}</span>
          </div>
        `;

        grid.appendChild(card);
      });

      document.getElementById('lblActiveCount').textContent = activeCount;
      document.getElementById('lblFinishedCount').textContent = finishedCount;
    });

    function clearAllTeams() {
      if (confirm("Are you sure you want to clear all active teams from the Radar database?")) {
        teamsRef.remove();
      }
    }
  </script>
</body>
</html>
