<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Genetics Command HQ 🔬</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800;900&display=swap" rel="stylesheet">
  <style>
    :root { var-bg: #090d16; --card: #151c2c; --cyan: #38bdf8; --green: #22c55e; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background: #090d16; color: #fff; padding: 1.5rem; min-height: 100vh; }
    
    header { display: flex; justify-content: space-between; align-items: center; background: #151c2c; padding: 1rem 1.5rem; border-radius: 16px; border: 1px solid rgba(56, 189, 248, 0.2); margin-bottom: 1.5rem; }
    h1 { color: #38bdf8; font-size: 1.5rem; font-weight: 900; }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 1rem; }

    .card { background: #151c2c; border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 1.2rem; display: flex; flex-direction: column; gap: 0.8rem; }
    .card.done { border-color: #22c55e; background: rgba(34, 197, 94, 0.1); }
    .card.lead { border-color: #f59e0b; box-shadow: 0 0 15px rgba(245, 158, 11, 0.2); }

    .bar { width: 100%; height: 8px; background: rgba(255,255,255,0.1); border-radius: 10px; overflow: hidden; }
    .fill { height: 100%; background: #38bdf8; transition: width 0.4s ease; }
    .fill.done { background: #22c55e; }

    .btn-reset { background: #f43f5e; color: white; border: none; padding: 0.6rem 1.2rem; border-radius: 10px; font-weight: 800; cursor: pointer; }
  </style>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>

  <header>
    <div>
      <h1>GENETICS COMMAND HQ</h1>
      <p style="color: #94a3b8; font-size: 0.85rem;">Live Grade 8-9 Pedigree Relay Dashboard</p>
    </div>
    <button class="btn-reset" onclick="resetAll()">Reset Activity 🔄</button>
  </header>

  <div class="grid" id="squadGrid">
    <div style="grid-column: 1/-1; text-align: center; color: #94a3b8; padding: 3rem; font-weight: 700;">
      📡 Waiting for student squads to log in...
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDtPA9VQ4Yv1MpvbYqdCW24bDf03tOpKqU",
      authDomain: "pedigree-9f98c.firebaseapp.com",
      databaseURL: "https://pedigree-9f98c-default-rtdb.firebaseio.com",
      projectId: "pedigree-9f98c",
      storageBucket: "pedigree-9f98c.firebasestorage.app",
      messagingSenderId: "484562688449",
      appId: "1:484562688449:web:ca050a92acdfcb0b183740"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    db.ref('teams').on('value', (snap) => {
      const data = snap.val();
      const grid = document.getElementById('squadGrid');
      if (!data) {
        grid.innerHTML = `<div style="grid-column: 1/-1; text-align: center; color: #94a3b8; padding: 3rem; font-weight: 700;">📡 Waiting for student squads to log in...</div>`;
        return;
      }

      const list = Object.keys(data).map(k => data[k]);
      list.sort((a, b) => b.stage - a.stage || a.timeElapsed - b.timeElapsed);

      grid.innerHTML = '';
      list.forEach((squad, rank) => {
        const isDone = squad.status === 'Finished';
        const isLead = rank === 0 && squad.stage > 1;
        const percent = (squad.stage / 5) * 100;
        const mins = Math.floor((squad.timeElapsed || 0) / 60);
        const secs = ((squad.timeElapsed || 0) % 60).toString().padStart(2, '0');

        const card = document.createElement('div');
        card.className = `card ${isDone ? 'done' : ''} ${isLead ? 'lead' : ''}`;
        card.innerHTML = `
          <div style="display:flex; justify-space-between; align-items:center;">
            <strong style="font-size:1.1rem;">${isLead ? '🥇 ' : ''}${squad.team}</strong>
            <span style="font-size:0.75rem; background:rgba(56,189,248,0.2); color:#38bdf8; padding:2px 8px; border-radius:12px; font-weight:800;">
              ${isDone ? 'FINISHED 🏆' : 'Q' + squad.stage + ' / 5'}
            </span>
          </div>
          <div class="bar">
            <div class="fill ${isDone ? 'done' : ''}" style="width:${percent}%;"></div>
          </div>
          <div style="display:flex; justify-content:space-between; font-size:0.8rem; color:#94a3b8;">
            <span>Status: ${squad.status}</span>
            <span>⏱️ ${mins}m ${secs}s</span>
          </div>
        `;
        grid.appendChild(card);
      });
    });

    function resetAll() {
      if (confirm("Reset all team data for a new game?")) db.ref('teams').remove();
    }
  </script>
</body>
</html>
